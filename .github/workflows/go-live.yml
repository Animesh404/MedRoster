# Go-live gate.
#
# The only path to production. Vercel's own Git integration is switched off for
# `main` in vercel.json (`git.deploymentEnabled.main: false`), so a merge does
# NOT deploy by itself — it deploys only by passing through here. Without that
# setting the gate would be decorative: Vercel would ship the commit the moment
# it landed and this workflow would grade an artefact that was already live.
#
# Four stages, cheapest first, and nothing downstream runs if an earlier one
# fails:
#
#   verify      — types, lint, unit tests, build
#   acceptance  — the real app against a real database and a real browser,
#                 then the SLO budgets in docs/SLO.md
#   deploy      — vercel deploy --prod
#   verify-live — the SLOs again, against production, including SLI 4: the
#                 running instance must report the commit this run built
#
# The last stage is the one that is easy to leave out and the one that catches
# the failure nobody expects — a green pipeline proves the artefact was good,
# not that it reached production.

name: Go-live gate

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # Never two deploys at once, and never cancel one midway: a cancelled
  # `vercel deploy` can leave the alias pointing at a half-promoted build.
  # This is the opposite of ci.yml's setting, deliberately — there, a
  # superseded test run is worth abandoning; here, an abandoned deploy is
  # worse than a slow one.
  #
  # Note what this does NOT promise: a run still QUEUED when a newer commit
  # arrives is cancelled, because GitHub keeps only the most recent pending run
  # per group. So merging three commits in quick succession deploys the third,
  # not each in turn. That is the behaviour you want from a deploy pipeline —
  # but it does mean an intermediate commit can show as `cancelled` without
  # anything being wrong.
  group: go-live
  cancel-in-progress: false

env:
  APP_ENV: development
  CLINIC_TZ: Europe/London
  SEED_PASSWORD: medroster123
  # Workflow-level, not job-level, because `npm ci` now runs `prisma generate`
  # via postinstall and `prisma.config.ts` validates the database env before it
  # will load. The acceptance job installs BEFORE `supabase start`, so without
  # this its very first step fails on a URL nothing has connected to yet.
  # `generate` reads the schema and never opens a connection; the acceptance job
  # later sets DATABASE_URL, which overrides APP_ENV entirely.
  DATABASE_URL_DEV: postgresql://postgres:postgres@localhost:5432/medroster
  # Local to the runner and thrown away with it. Real secrets live in the
  # repository's GitHub Actions secrets and Vercel's own environment.
  CRON_SECRET: gate-only-not-a-real-secret
  # The Vercel team the project lives under. `vercel pull` failed with
  # "Could not retrieve Project Settings" without it — a message that reads like
  # a broken project link but is what a token scoped to the personal account
  # says when the project belongs to a team.
  VERCEL_SCOPE: animesh404s-projects

jobs:
  verify:
    name: 1 · verify
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Generate Next types
        # `next-env.d.ts` is gitignored (Next's own template ignores it) and is
        # what declares the ambient modules for static image imports, via its
        # reference to `next/image-types/global`. It only appears once a Next
        # command has run — so a fresh clone type-checks BEFORE anything has
        # generated it, and `import hero from '@/assets/images/hero.jpg'` fails
        # with "Cannot find module". Locally it passes, because a build has
        # always already happened.
        #
        # `typegen` does exactly this and nothing else, so it stays cheap.
        run: npx next typegen

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        # --max-warnings 0: a warning that nothing fails on is a warning
        # nobody fixes. eslint.config.mjs already allows the deliberate
        # underscore-prefixed unused parameters, so zero is achievable.
        run: npx eslint . --max-warnings 0

      - name: Unit and integration tests
        run: npm test

      - name: Build
        run: npm run build

  acceptance:
    name: 2 · acceptance (e2e + SLOs)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Start Supabase
        # The e2e specs sign in as real seeded accounts, so this needs a real
        # auth server rather than a stub — a login path exercised against a
        # fake is the one path where a fake proves least.
        #
        # The excluded services are the ones MedRoster never touches. Starting
        # them costs several minutes of image pulls and, in this project's
        # experience, is where `supabase start` hangs unhealthy.
        run: |
          npx supabase start \
            -x studio,imgproxy,edge-runtime,logflare,vector,supavisor,storage-api,postgres-meta

      - name: Export Supabase credentials
        # `supabase status -o env` prints the keys this instance generated.
        # They differ per run, so they cannot be hardcoded.
        run: |
          npx supabase status -o env > /tmp/supabase.env
          {
            echo "DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:54322/postgres"
            echo "NEXT_PUBLIC_SUPABASE_URL=$(grep '^API_URL=' /tmp/supabase.env | cut -d= -f2- | tr -d '"')"
            echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$(grep '^ANON_KEY=' /tmp/supabase.env | cut -d= -f2- | tr -d '"')"
            echo "SUPABASE_SERVICE_ROLE_KEY=$(grep '^SERVICE_ROLE_KEY=' /tmp/supabase.env | cut -d= -f2- | tr -d '"')"
            echo "APP_URL=http://localhost:3100"
          } >> "$GITHUB_ENV"

      - name: Migrate and seed
        # The same importer that runs in production, against the same dirty
        # CSVs, so the browser suite drives the data a real deployment has
        # rather than a hand-built fixture that cannot reproduce an import bug.
        run: |
          npx prisma migrate deploy
          npm run db:seed

      - name: Build and start
        run: |
          npm run build
          npm start -- -p 3100 &
          echo "Waiting for the server to become ready…"
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:3100/api/health > /dev/null 2>&1; then
              echo "Ready after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "Server never became ready — /api/health did not return 200 within 60s"
          curl -sS -i http://localhost:3100/api/health || true
          exit 1

      - name: Install Chrome
        # playwright.config.ts pins `channel: 'chrome'` — real Google Chrome,
        # not the bundled Chromium — so the suite exercises the browser people
        # actually use.
        run: npx playwright install chrome --with-deps

      - name: End-to-end suite
        env:
          BASE_URL: http://localhost:3100
        run: npm run test:e2e

      - name: SLO budgets
        # docs/SLO.md holds the numbers and the reasoning. Runs after the
        # browser suite so the server is warm in the same way a live one is.
        env:
          BASE_URL: http://localhost:3100
        run: npm run slo

      - name: Upload Playwright artefacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: |
            test-results/
            playwright-report/
          retention-days: 7
          if-no-files-found: ignore

  deploy:
    name: 3 · deploy to Vercel
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [verify, acceptance]
    # workflow_dispatch can be used to re-run the gate without shipping; only a
    # real merge to main deploys.
    if: github.event_name == 'push'
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Check deploy credentials are present
        # Without this the CLI fails deep inside a build step with a message
        # about linking a project, which reads as a build problem rather than a
        # missing secret.
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          missing=""
          [ -n "$VERCEL_TOKEN" ]      || missing="$missing VERCEL_TOKEN"
          [ -n "$VERCEL_ORG_ID" ]     || missing="$missing VERCEL_ORG_ID"
          [ -n "$VERCEL_PROJECT_ID" ] || missing="$missing VERCEL_PROJECT_ID"
          if [ -n "$missing" ]; then
            echo "Missing repository secrets:$missing"
            echo "Set them under Settings → Secrets and variables → Actions."
            echo "VERCEL_ORG_ID and VERCEL_PROJECT_ID are in .vercel/project.json after 'vercel link'."
            exit 1
          fi

      - run: npm ci

      - name: Show what the token can reach
        # Runs before the first real command so a credential problem reads as
        # one. The previous failure was `Could not retrieve Project Settings`,
        # which sounds like a broken link and is usually a token that cannot see
        # the team the project lives in.
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          npx vercel whoami --token="$VERCEL_TOKEN"
          npx vercel teams ls --token="$VERCEL_TOKEN"

      - name: Pull Vercel production environment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: npx vercel pull --yes --environment=production --scope "$VERCEL_SCOPE" --token="$VERCEL_TOKEN"

      - name: Apply database migrations
        # Before the new code is serving, not after. A deployment whose code
        # expects a column its database does not have is an outage, and the
        # window between "new code live" and "migration applied" is exactly
        # when that happens.
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_PROD }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "DATABASE_URL_PROD secret is not set — refusing to deploy code"
            echo "whose migrations have not been applied."
            exit 1
          fi
          npx prisma migrate deploy

      - name: Build
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: npx vercel build --prod --scope "$VERCEL_SCOPE" --token="$VERCEL_TOKEN"

      - name: Deploy
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          url=$(npx vercel deploy --prebuilt --prod --scope "$VERCEL_SCOPE" --token="$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed to $url"

  verify-live:
    name: 4 · verify production
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: deploy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: SLOs against production
        # EXPECT_COMMIT turns on SLI 4. The live instance has to report the
        # commit this run built — otherwise the pipeline was green for an
        # artefact that is not the one serving traffic, which a green deploy
        # step alone cannot tell you.
        env:
          BASE_URL: ${{ needs.deploy.outputs.url }}
          EXPECT_COMMIT: ${{ github.sha }}
        run: npm run slo

      - name: Report
        run: echo "Live and verified at ${{ needs.deploy.outputs.url }} (commit ${GITHUB_SHA:0:7})"
