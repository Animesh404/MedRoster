# Runs only the `app` service. Postgres and auth now live in the Supabase CLI
# stack (`npx supabase start ...`, see README) — auth and application data must
# share one database, and the CLI stack owns it. Start that stack first.
#
# `host.docker.internal` rather than `127.0.0.1`: the app runs inside this
# container, and `127.0.0.1` there means the container itself, not the host
# machine the CLI stack is listening on.
services:
  app:
    build: .
    environment:
      DATABASE_URL: postgresql://postgres:postgres@host.docker.internal:54322/postgres
      NEXT_PUBLIC_SUPABASE_URL: http://host.docker.internal:54321
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      APP_URL: http://localhost:3000
      CLINIC_TZ: Europe/London
      SEED_PASSWORD: medroster123
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    ports: ['3000:3000']
    command: sh -c "npx prisma migrate deploy && npx tsx prisma/seed.ts && npm run start"
